<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="JCraft Studio에서 새로운 웹 도구를 준비하고 있습니다."
  >

  <meta name="author" content="JCraft Studio">
  <meta name="theme-color" content="#ffffff">

  <!-- 준비 중 페이지는 검색 결과에 노출하지 않음 -->
  <meta name="robots" content="noindex, follow">

  <title>서비스 준비 중 | JCraft Studio</title>

  <style>
    :root {
      --primary: #1769e0;
      --primary-dark: #0d54bd;
      --primary-soft: #edf5ff;

      --background: #f5f7fa;
      --surface: #ffffff;

      --text-primary: #172033;
      --text-secondary: #526071;
      --text-muted: #8b96a5;

      --border: #e2e7ed;

      --header-height: 78px;
      --container-width: 1240px;

      --shadow-medium:
        0 18px 50px rgba(32, 48, 72, 0.11);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--text-primary);
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        Arial,
        sans-serif;
      line-height: 1.6;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }

    body.mobile-menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul {
      list-style: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      background: none;
      cursor: pointer;
    }

    svg {
      display: block;
    }

    .container {
      width: min(
        calc(100% - 40px),
        var(--container-width)
      );
      margin: 0 auto;
    }

    /* 공통 header.html을 위한 스타일 */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: var(--header-height);
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      flex: 0 0 auto;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 13px;
      background:
        linear-gradient(
          145deg,
          #4a9cff,
          var(--primary)
        );
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      box-shadow:
        0 8px 18px rgba(23, 105, 224, 0.22);
    }

    .brand-name {
      font-size: 19px;
      font-weight: 850;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .desktop-navigation {
      align-self: stretch;
      display: flex;
      align-items: stretch;
      margin-left: auto;
    }

    .desktop-menu {
      display: flex;
      align-items: stretch;
      height: 100%;
    }

    .desktop-menu-item {
      display: flex;
      align-items: stretch;
    }

    .desktop-menu-button,
    .desktop-menu-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 17px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 780;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .desktop-menu-button:hover,
    .desktop-menu-link:hover {
      color: var(--primary);
    }

    .menu-chevron {
      width: 15px;
      height: 15px;
      transition: transform 0.2s ease;
    }

    .desktop-menu-item:hover .menu-chevron,
    .desktop-menu-item.active .menu-chevron {
      transform: rotate(180deg);
    }

    .header-store-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      align-self: center;
      min-height: 43px;
      margin-left: 12px;
      padding: 0 16px;
      border-radius: 11px;
      background: var(--primary);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .header-store-link svg {
      width: 17px;
      height: 17px;
    }

    .mega-menu-area {
      position: absolute;
      top: var(--header-height);
      right: 0;
      left: 0;
      z-index: 990;
      overflow: hidden;
      max-height: 0;
      border-bottom: 1px solid transparent;
      background: rgba(255, 255, 255, 0.985);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-12px);
      transition:
        max-height 0.38s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.22s ease,
        transform 0.32s ease;
    }

    .mega-menu-area.open {
      max-height: 410px;
      border-color: var(--border);
      box-shadow:
        0 22px 40px rgba(31, 48, 72, 0.11);
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .mega-menu-inner {
      min-height: 280px;
      padding: 34px 0 38px;
    }

    .mega-panel {
      display: none;
      grid-template-columns: 270px 1fr;
      gap: 48px;
    }

    .mega-panel.active {
      display: grid;
    }

    .mega-intro {
      padding-right: 38px;
      border-right: 1px solid var(--border);
    }

    .mega-icon {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 15px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .mega-icon svg {
      width: 25px;
      height: 25px;
    }

    .mega-title {
      font-size: 24px;
      font-weight: 850;
    }

    .mega-description {
      margin-top: 10px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.75;
    }

    .mega-links {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 10px 20px;
      align-content: start;
    }

    .mega-link {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 68px;
      padding: 11px 13px;
      border-radius: 13px;
    }

    .mega-link:hover {
      background: var(--primary-soft);
    }

    .mega-link-icon {
      display: grid;
      flex: 0 0 auto;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text-secondary);
    }

    .mega-link-icon svg {
      width: 19px;
      height: 19px;
    }

    .mega-link-title {
      display: block;
      font-size: 13px;
      font-weight: 800;
    }

    .mega-link-description {
      display: block;
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 10px;
    }

    .mega-menu-overlay {
      position: fixed;
      inset: var(--header-height) 0 0;
      z-index: 980;
      display: none;
      background: rgba(12, 24, 40, 0.22);
    }

    .mega-menu-overlay.open {
      display: block;
    }

    .mobile-menu-button {
      display: none;
      width: 43px;
      height: 43px;
      place-items: center;
      border-radius: 11px;
    }

    .mobile-menu-button svg {
      width: 24px;
      height: 24px;
    }

    .mobile-navigation {
      position: fixed;
      top: var(--header-height);
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 995;
      display: none;
      overflow-y: auto;
      padding: 16px 16px 40px;
      background: #ffffff;
    }

    .mobile-navigation.open {
      display: block;
    }

    .mobile-category {
      border-bottom: 1px solid var(--border);
    }

    .mobile-category-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 60px;
      padding: 0 7px;
      font-size: 16px;
      font-weight: 800;
      text-align: left;
    }

    .mobile-category-button svg {
      width: 19px;
      height: 19px;
      transition: transform 0.25s ease;
    }

    .mobile-category.open
    .mobile-category-button svg {
      transform: rotate(180deg);
    }

    .mobile-submenu {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s ease;
    }

    .mobile-category.open .mobile-submenu {
      grid-template-rows: 1fr;
    }

    .mobile-submenu-inner {
      overflow: hidden;
    }

    .mobile-submenu-links {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding-bottom: 17px;
    }

    .mobile-submenu-link {
      padding: 13px;
      border-radius: 11px;
      background: #f8fafc;
      font-size: 12px;
      font-weight: 750;
    }

    .mobile-single-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
      padding: 0 7px;
      border-bottom: 1px solid var(--border);
      font-size: 16px;
      font-weight: 800;
    }

    .mobile-store-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: 18px;
      border-radius: 12px;
      background: var(--primary);
      color: #ffffff;
      font-size: 14px;
      font-weight: 850;
    }

    /* 준비 중 페이지 */

    .coming-soon-page {
      display: grid;
      min-height: calc(
        100vh - var(--header-height)
      );
      place-items: center;
      padding: 80px 20px;
      overflow: hidden;
    }

    .coming-soon-card {
      position: relative;
      width: min(100%, 720px);
      overflow: hidden;
      padding: 72px 48px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow-medium);
      text-align: center;
    }

    .coming-soon-card::before,
    .coming-soon-card::after {
      position: absolute;
      border-radius: 999px;
      content: "";
      pointer-events: none;
    }

    .coming-soon-card::before {
      top: -140px;
      right: -120px;
      width: 330px;
      height: 330px;
      background:
        rgba(23, 105, 224, 0.07);
    }

    .coming-soon-card::after {
      bottom: -170px;
      left: -140px;
      width: 360px;
      height: 360px;
      background:
        rgba(23, 105, 224, 0.045);
    }

    .coming-soon-content {
      position: relative;
      z-index: 2;
    }

    .coming-soon-icon {
      display: grid;
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      place-items: center;
      border-radius: 25px;
      background:
        linear-gradient(
          145deg,
          #4a9cff,
          var(--primary)
        );
      color: #ffffff;
      box-shadow:
        0 16px 34px rgba(23, 105, 224, 0.24);
    }

    .coming-soon-icon svg {
      width: 42px;
      height: 42px;
    }

    .coming-soon-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 16px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.7px;
    }

    .coming-soon-label::before {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--primary);
      content: "";
    }

    .coming-soon-title {
      font-size: clamp(34px, 6vw, 52px);
      font-weight: 900;
      line-height: 1.22;
      letter-spacing: -2px;
    }

    .coming-soon-description {
      max-width: 530px;
      margin: 22px auto 0;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.9;
    }

    /* 공통 footer.html 스타일 */

    .site-footer {
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .footer-main {
      display: grid;
      grid-template-columns:
        1.4fr repeat(3, 0.7fr);
      gap: 50px;
      padding: 57px 0 40px;
    }

    .footer-brand-description {
      max-width: 380px;
      margin-top: 16px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.75;
    }

    .footer-title {
      margin-bottom: 14px;
      font-size: 12px;
      font-weight: 850;
    }

    .footer-links {
      display: grid;
      gap: 10px;
    }

    .footer-link {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 650;
    }

    .footer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 21px 0 29px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
    }

    .scroll-top-button {
      position: fixed;
      right: 21px;
      bottom: 21px;
      z-index: 900;
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: var(--shadow-medium);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .scroll-top-button.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    @media (max-width: 860px) {
      :root {
        --header-height: 68px;
      }

      .container {
        width: min(
          calc(100% - 28px),
          var(--container-width)
        );
      }

      .desktop-navigation,
      .header-store-link,
      .mega-menu-area,
      .mega-menu-overlay {
        display: none !important;
      }

      .mobile-menu-button {
        display: grid;
      }

      .footer-main {
        grid-template-columns: 1fr 1fr;
      }

      .footer-main > div:first-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 600px) {
      .container {
        width: min(
          calc(100% - 20px),
          var(--container-width)
        );
      }

      .brand-name {
        font-size: 17px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
      }

      .coming-soon-page {
        min-height: calc(
          100vh - var(--header-height)
        );
        padding: 45px 10px;
      }

      .coming-soon-card {
        padding: 56px 24px;
        border-radius: 21px;
      }

      .coming-soon-icon {
        width: 76px;
        height: 76px;
        border-radius: 21px;
      }

      .coming-soon-icon svg {
        width: 36px;
        height: 36px;
      }

      .coming-soon-title {
        font-size: 34px;
        letter-spacing: -1.5px;
      }

      .coming-soon-description {
        font-size: 14px;
      }

      .mobile-submenu-links {
        grid-template-columns: 1fr;
      }

      .footer-main {
        grid-template-columns: 1fr;
      }

      .footer-main > div:first-child {
        grid-column: auto;
      }

      .footer-bottom {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div id="siteHeaderContainer"></div>

  <main class="coming-soon-page">
    <section
      class="coming-soon-card"
      aria-labelledby="comingSoonTitle"
    >
      <div class="coming-soon-content">

        <div
          class="coming-soon-icon"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 21h16"></path>
            <path d="M6 21 8 8h8l2 13"></path>
            <path d="M9 8V5a3 3 0 0 1 6 0v3"></path>
            <path d="M8 14h8"></path>
          </svg>
        </div>

        <p class="coming-soon-label">
          COMING SOON
        </p>

        <h1
          class="coming-soon-title"
          id="comingSoonTitle"
        >
          서비스 준비 중
        </h1>

        <p class="coming-soon-description">
          현재 이 기능은 개발 중입니다.<br>
          더 나은 기능과 안정성을 위해 준비하고 있으며<br>
          곧 서비스를 시작할 예정입니다.
        </p>

      </div>
    </section>
  </main>

  <div id="siteFooterContainer"></div>

  <script src="/webtools/layout.js"></script>

</body>
</html>
